<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to myPTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --navy:#120a38;
    --bg:#ece9f6;
    --purple:#5231a9;
    --purple-text:#6a2a96;
    --link:#4b2fa5;
    --border:#767676;
    --placeholder:#55526a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:#000;
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:44px 16px 40px;
  }

  .card{
    background:#fff;
    width:100%;
    max-width:640px;
    padding:48px 40px 29px;
  }

  .logo{display:block;width:245px;max-width:100%;height:auto;margin:0 auto 29px;}
  .logo .cls-1{fill:var(--navy);}

  h1{
    text-align:center;
    font-size:30px;
    line-height:36px;
    font-weight:400;
    color:var(--navy);
    margin:0;
    letter-spacing:.01em;
  }
  .subtitle{
    text-align:center;
    color:var(--navy);
    font-size:16px;
    line-height:20px;
    margin:0 0 32px;
    letter-spacing:.01em;
  }

  .field{
    position:relative;
    height:62px;
    border:1px solid var(--border);
    border-radius:2px;
    background:#fff;
    margin-bottom:36px;
    display:flex;
    align-items:center;
  }
  .field:focus-within{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);}
  .field input{
    flex:1;
    min-width:0;
    height:100%;
    border:none;
    outline:none;
    background:transparent;
    padding:0 16px;
    font:400 24px 'Archivo','Helvetica Neue',Arial,sans-serif;
    letter-spacing:.03em;
    color:var(--navy);
  }
  .field input::placeholder{color:var(--placeholder);opacity:1;}
  .toggle-eye{
    background:none;border:none;cursor:pointer;
    color:#666;padding:0;margin-right:24px;
    display:flex;align-items:center;
  }

  .btn{
    display:block;
    width:100%;
    max-width:336px;
    height:60px;
    margin:0 auto;
    background:var(--purple);
    color:#fff;
    border:4px solid var(--purple);
    border-radius:999px;
    font:600 26px 'Archivo','Helvetica Neue',Arial,sans-serif;
    letter-spacing:-.01em;
    cursor:pointer;
    text-align:center;
  }
  .btn:hover{background:#432a90;border-color:#432a90;}
  .btn.outline{height:58px;background:#fff;color:var(--navy);}
  .btn.outline:hover{background:#f5f2fd;border-color:var(--purple);}

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    max-width:336px;
    margin:28px auto 29px;
    padding:0 0 0 4px;
    font-size:12px;
    line-height:16px;
    color:#000;
  }
  .remember{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .remember input{
    appearance:none;-webkit-appearance:none;
    width:18px;height:18px;margin:0;
    border:2px solid #555;border-radius:0;background:#fff;
    cursor:pointer;position:relative;
  }
  .remember input:checked{background:var(--purple);border-color:var(--purple);}
  .remember input:checked::after{
    content:"";position:absolute;left:4px;top:0;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .forgot a{color:var(--link);text-decoration:none;}
  .forgot a:hover{text-decoration:underline;}

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    max-width:336px;
    margin:0 auto 22px;
  }
  .divider hr{flex:1;border:none;border-top:1px solid #c8c5d6;margin:0;}
  .divider span{
    color:var(--purple-text);
    font-size:16px;
    line-height:20px;
    white-space:nowrap;
  }

  footer{
    text-align:center;
    font-size:12px;
    line-height:15px;
    color:#222;
    margin-top:24px;
  }
  footer a{color:var(--purple-text);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  footer .sep{margin:0 4px;}

  @media (max-width:480px){
    .card{padding:36px 20px 28px;}
    .logo{width:200px;}
    h1{font-size:26px;}
    .field input{font-size:20px;}
  }
</style>
</head>
<body>

<div class="card">

    </g>
  </svg>

  <h1>Welcome to myPTE</h1>
  <p class="subtitle">Book your tests and access your results.</p>

  <div class="field">
    <input type="text" id="username" placeholder="Username" autocomplete="username">
  </div>

  <div class="field">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button type="button" class="toggle-eye" id="eye-btn" aria-label="Show password">
      <svg width="40" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
    </button>
  </div>

  <p id="login-error" role="alert" style="display:none;color:#d93048;font-weight:600;font-size:14px;text-align:center;margin:-16px 0 18px"></p>
  <button class="btn" id="login-btn">Log in</button>

  <div class="row-between">
    <label class="remember"><input type="checkbox" id="remember">Remember me</label>
    <span class="forgot">Forgot your <a href="#">username</a> or <a href="#">password</a>?</span>
  </div>

  <div class="divider">
    <hr><span>Need a myPTE account?</span><hr>
  </div>

  <button class="btn outline" id="signup-btn">Sign up</button>
</div>

<footer>
  <div><a href="#">Privacy policy</a><span class="sep">|</span><a href="#">Cookie preferences</a><span class="sep">|</span><a href="#">Contact us</a></div>
  <div>Copyright &copy; 1996&ndash;2026 Pearson. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const pwInput = document.getElementById('password');
  document.getElementById('eye-btn').addEventListener('click', function(){
    pwInput.type = pwInput.type === 'text' ? 'password' : 'text';
  });
  const errEl = document.getElementById('login-error');
  function showErr(m){ errEl.textContent = m; errEl.style.display = 'block'; }

  // لو مسجل دخول بالفعل روح للهوم
  (async()=>{
    const t = getToken(); if(!t) return;
    const { data } = await sb.rpc('get_me', { p_token: t });
    if(data) location.replace('Home.html'); else clearToken();
  })();

  async function doLogin(){
    errEl.style.display = 'none';
    const u = document.getElementById('username').value.trim();
    if(!u || !pwInput.value){ showErr('Please enter your username and password.'); return; }
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Logging in...';
    const { data, error } = await sb.rpc('login_user', { p_username: u, p_password: pwInput.value });
    btn.disabled = false; btn.textContent = 'Log in';
    if(error){
      showErr(/INVALID_LOGIN/.test(error.message) ? 'Incorrect username or password.' : error.message);
      return;
    }
    setToken(data.token);
    location.href = 'Home.html';
  }
  document.getElementById('login-btn').addEventListener('click', doLogin);
  pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('signup-btn').addEventListener('click', function(){
    location.href = 'register.html';
  });
</script>

</body>
</html>
